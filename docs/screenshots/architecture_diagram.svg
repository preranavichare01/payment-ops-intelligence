<svg width="680" height="540" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Payment Ops Intelligence Platform architecture</title>
<desc>Kafka event streams flow into Spark structured streaming, then a correlation and reconciliation stage, then Gold marts, which feed four consumers: Streamlit, Power BI, a Groq AI agent, and Great Expectations data quality checks. Airflow monitors the streaming stage.</desc>
